name: pipeline
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: npm ci
      - run: npm test
      # if !cancelled(): cada puerta corre aunque falle la anterior,
      # asi un solo run muestra TODOS los problemas y no solo el primero.
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      - if: ${{ !cancelled() }}
        run: pipx install semgrep
      - if: ${{ !cancelled() }}
        run: semgrep scan --config auto --error
      - if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Trivy fijado en 0.69.3: las versiones 0.69.4, 0.69.5 y 0.69.6 fueron
      # maliciosas (ataque a la cadena de suministro, marzo 2026, CVE-2026-33634).
      - if: ${{ !cancelled() }}
        name: Trivy config (Dockerfile)
        run: docker run --rm -v "$PWD":/src aquasec/trivy:0.69.3 config --skip-dirs node_modules --exit-code 1 --severity HIGH,CRITICAL /src
      # DAST: levantar la app en segundo plano y esperar a que responda.
      - name: Levantar la app
        run: |
          node app.js &
          curl -sf --retry 10 --retry-connrefused --retry-delay 1 "http://localhost:3000/total?p=10&c=2"
      - name: ZAP baseline (DAST)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:3000/total?p=10&c=2"
          allow_issue_writing: false
          artifact_name: zap-report
